services:
  vps:
    environment:
      OPENSTACK_AUTH_URL: ${OPENSTACK_AUTH_URL:-}
      OPENSTACK_REGION_NAME: ${OPENSTACK_REGION_NAME:-RegionOne}
      OPENSTACK_USERNAME: ${OPENSTACK_USERNAME:-}
      OPENSTACK_PASSWORD: ${OPENSTACK_PASSWORD:-}
      OPENSTACK_PROJECT_NAME: ${OPENSTACK_PROJECT_NAME:-}
      OPENSTACK_USER_DOMAIN_NAME: ${OPENSTACK_USER_DOMAIN_NAME:-Default}
      OPENSTACK_PROJECT_DOMAIN_NAME: ${OPENSTACK_PROJECT_DOMAIN_NAME:-Default}
      OPENSTACK_DOMAIN_NAME: ${OPENSTACK_DOMAIN_NAME:-${OPENSTACK_USER_DOMAIN_NAME:-Default}}
      OPENSTACK_NETWORK_ID: ${OPENSTACK_NETWORK_ID:-}
      OPENSTACK_FLOATING_NETWORK_ID: ${OPENSTACK_FLOATING_NETWORK_ID:-}
      OPENSTACK_FLOATING_SUBNET_ID: ${OPENSTACK_FLOATING_SUBNET_ID:-}
      OPENSTACK_PLAN_MAP: ${OPENSTACK_PLAN_MAP:-}
      OPENSTACK_OS_MAP: ${OPENSTACK_OS_MAP:-}
      OPENSTACK_PROVISION_REGIONS: ${OPENSTACK_PROVISION_REGIONS:-}
      OPENSTACK_NODE_MAP: ${OPENSTACK_NODE_MAP:-}
      OPENSTACK_INSECURE_TLS: ${OPENSTACK_INSECURE_TLS:-false}

  vps-worker:
    environment:
      OPENSTACK_AUTH_URL: ${OPENSTACK_AUTH_URL:-}
      OPENSTACK_REGION_NAME: ${OPENSTACK_REGION_NAME:-RegionOne}
      OPENSTACK_USERNAME: ${OPENSTACK_USERNAME:-}
      OPENSTACK_PASSWORD: ${OPENSTACK_PASSWORD:-}
      OPENSTACK_PROJECT_NAME: ${OPENSTACK_PROJECT_NAME:-}
      OPENSTACK_USER_DOMAIN_NAME: ${OPENSTACK_USER_DOMAIN_NAME:-Default}
      OPENSTACK_PROJECT_DOMAIN_NAME: ${OPENSTACK_PROJECT_DOMAIN_NAME:-Default}
      OPENSTACK_DOMAIN_NAME: ${OPENSTACK_DOMAIN_NAME:-${OPENSTACK_USER_DOMAIN_NAME:-Default}}
      OPENSTACK_NETWORK_ID: ${OPENSTACK_NETWORK_ID:-}
      OPENSTACK_FLOATING_NETWORK_ID: ${OPENSTACK_FLOATING_NETWORK_ID:-}
      OPENSTACK_FLOATING_SUBNET_ID: ${OPENSTACK_FLOATING_SUBNET_ID:-}
      OPENSTACK_PLAN_MAP: ${OPENSTACK_PLAN_MAP:-}
      OPENSTACK_OS_MAP: ${OPENSTACK_OS_MAP:-}
      OPENSTACK_PROVISION_REGIONS: ${OPENSTACK_PROVISION_REGIONS:-}
      OPENSTACK_NODE_MAP: ${OPENSTACK_NODE_MAP:-}
      OPENSTACK_INSECURE_TLS: ${OPENSTACK_INSECURE_TLS:-false}
      VPS_WORKER_INTERVAL: ${VPS_WORKER_INTERVAL:-5s}
      VPS_GUEST_AGENT_WARMUP: ${VPS_GUEST_AGENT_WARMUP:-45s}
